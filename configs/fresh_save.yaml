# Fresh-save configuration for blueprince-sim
#
# Represents a brand-new Blue Prince save file with nothing earned yet.
# Use with: blueprince-sim play --config configs/fresh_save.yaml
#          blueprince-sim batch --config configs/fresh_save.yaml
#
# Results produced with this config are NOT comparable to the day=20 all-unlocks
# training baseline: day=1 resolves to week1 rarity tables (stage="auto" with
# day<=7), gem_gate_active() is off, and there are no orchard/mine bonuses.
#
# TWO deliberate exceptions to "nothing earned":
#
# veteran_mode=true. Veteran Mode is reachable on day 1 by an experienced player
# (draft the first three rooms out of the Entrance Hall quickly), so it is
# assumed triggered -- the trigger is not modelled, only its outcome. This makes
# gem_gate_active() true at day 1, enables the Garage forced draw before day 3,
# and selects the veteran Upgrade-Disk tables.
#
# royal_scepter_found=true. The Key of Aries ->
# Treasure Trove unlock chain is unmodelled, so leaving it false means the
# scepter is never exercised and its green-colour bias (which makes Cloisters
# appear) is absent from all measurements. Everything else is exactly what a
# player sees on day 1 of a new file.

day: 1
stage: auto
starting_steps: 50
studio_additions: []
west_gate_unlatched: false
orchard_unlocked: false
mine_unlocked: false
upgrade_disks: []
veteran_mode: true   # assumed triggered on day 1 by an experienced player
room46_reached: false
satisfied_conditions: []
door_locks: true
strict_door_matching: false
compass: false
ornate_compass: false
special_items: true
starting_items: []
lunch_box_unlocked: false
cursed_effigy_unlocked: false
royal_scepter_found: true
used_vault_keys: []
draft_counts: {}
entrance_vase_broken: false
outer_chip_dug: false
banned_rooms: []
lit_targets: []
collected_disks: []
chapel_tithes: 0
reward: shaped
